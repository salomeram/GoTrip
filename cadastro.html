<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crie sua conta GoTrip e comece a planejar sua próxima viagem.">
  <title>GoTrip | Criar conta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="microinteracoes.css">
</head>
<body id="topo">

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header>
    <a href="home.html" class="logo">
      <img src="logo-gotrip-texto.svg" alt="GoTrip, página inicial" width="108" height="40">
    </a>
    <nav aria-label="Menu principal">
      <ul class="pilulas">
        <li><a href="home.html">Início</a></li>
        <li><a href="destinos.html">Destinos</a></li>
        <li><a href="mapa.html">Mapa</a></li>
        <li><a href="agenda.html">Agenda</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="sobre_a_equipe.html">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section aria-labelledby="titulo-cadastro">
      <a class="voltar" href="home.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o início</a>
      <h1 id="titulo-cadastro">Crie a sua conta</h1>
      <!-- Sem back-end ainda: o nome e o e-mail ficam guardados no navegador (usuario.js). A senha ainda não é guardada nem verificada. -->
      <form id="form-cadastro" class="formulario" method="post">
        <div class="campo">
          <label for="reg-nome">Nome completo</label>
          <input type="text" id="reg-nome" name="nome" placeholder="Ex.: Maria Souza" autocomplete="name" required>
        </div>
        <div class="campo">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" name="email" placeholder="exemplo@gotrip.com" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="reg-senha">Senha</label>
          <input type="password" id="reg-senha" name="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required>
        </div>
        <p id="cadastro-erro" role="alert" hidden></p>
        <button type="submit">Criar conta</button>
      </form>
      <p>Já tem conta?</p>
      <a class="btn btn-secundario" href="login.html">Entrar</a>
    </section>
  </main>

  <footer>
    <nav aria-label="Menu do rodapé">
      <ul class="pilulas">
        <li><a href="como-funciona.html">Como funciona</a></li>
        <li><a href="ajuda.html">Ajuda</a></li>
        <li><a href="sobre_a_equipe.html">Sobre</a></li>
      </ul>
    </nav>
    <address>
      <a class="chip" href="mailto:contato@gotrip.com"><i class="fa-regular fa-envelope" aria-hidden="true"></i> contato@gotrip.com</a>
    </address>
    <p>© 2026 GoTrip. Todos os direitos reservados.</p>
  </footer>

  <script src="usuario.js"></script>
  <script>
    document.getElementById('form-cadastro').addEventListener('submit', function (e) {
      e.preventDefault();
      var erro = document.getElementById('cadastro-erro');

      function mostrarErro(texto) {
        erro.textContent = texto;
        erro.hidden = false;
        erro.setAttribute('tabindex', '-1');
        erro.focus();
      }

      if (typeof GoTripUsuario === 'undefined') {
        mostrarErro('Não foi possível carregar o sistema de conta. Confira se o arquivo usuario.js está na mesma pasta das páginas.');
        return;
      }
      var nome = document.getElementById('reg-nome').value;
      var email = document.getElementById('reg-email').value;

      if (GoTripUsuario.criarConta(nome, email)) {
        window.location.href = 'perfil.html?aviso=conta-criada';
      } else {
        mostrarErro('Não foi possível salvar sua conta neste navegador. Verifique se o armazenamento não está bloqueado.');
      }
    });
  </script>
</body>
</html>
