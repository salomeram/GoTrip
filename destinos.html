  <header>
    <a href="home.html" class="logo">
      <img src="logo-gotrip-texto.svg" alt="GoTrip, página inicial" width="108" height="40">
    </a>
    <nav aria-label="Menu principal">
      <ul class="pilulas">
        <li><a href="home.html">Início</a></li>
        <li><a href="destinos.html" aria-current="page">Destinos</a></li>

  <main id="conteudo">
    <section aria-labelledby="titulo-destinos">
      <a class="voltar" href="home.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o início</a>
      <h1 id="titulo-destinos">Destinos</h1>
      <form id="form-busca" action="destinos.html" method="get" role="search">
        <label for="busca">Buscar destino</label>
        <div class="campo-busca">
          <input type="search" id="busca" name="busca" placeholder="Cidade ou país" autocomplete="off">
          <button type="submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Buscar</button>
        </div>
      </form>
      <label for="filtro-cidade">Filtrar por cidade</label>
      <select id="filtro-cidade" name="cidade">
        <option value="">Todas as cidades</option>
        <option value="Roma">Roma</option>
        <option value="Paris">Paris</option>
        <option value="Lisboa">Lisboa</option>
        <option value="Tóquio">Tóquio</option>
        <option value="Rio de Janeiro">Rio de Janeiro</option>
        <option value="Nova York">Nova York</option>
      </select>
      <p id="resultado-busca" role="status" aria-live="polite"></p>
      <div class="lista-cartoes" id="lista-pontos" aria-live="polite"></div>
    </section>
  </main>
