      <img src="logo-gotrip-texto.svg" alt="GoTrip, página inicial" width="108" height="40">

    <nav aria-label="Menu principal">
      <ul class="pilulas">

  <main id="conteudo">
    <section aria-labelledby="titulo-login">
      <a class="voltar" href="home.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o início</a>
      <h1 id="titulo-login">Entrar</h1>
      <p>Planeje, explore e <strong>viva novas histórias</strong>.</p>
      <!-- Sem back-end ainda: o login reconhece contas criadas neste navegador (usuario.js). A senha ainda não é verificada. -->
      <form id="form-login" class="formulario" method="post">
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" placeholder="exemplo@gotrip.com" autocomplete="email" aria-describedby="login-erro" required>
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <p id="login-erro" role="alert" hidden></p>
        <button type="submit">Entrar <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
      </form>
      <p>Não tem uma conta?</p>
      <a class="btn btn-secundario" href="cadastro.html">Criar conta</a>
    </section>
  </main>
