<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Escolha uma cidade para ver os pontos turísticos.">
  <title>GoTrip | Destinos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="microinteracoes.css">
</head>
<body id="topo">

  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header>
    <a href="index.html" class="logo">
      <img class="logo-tema-escuro" src="logo-gotrip-texto.svg" alt="GoTrip, página inicial" width="108" height="40">
      <img class="logo-tema-claro" src="logo-gotrip-texto.svg" alt="GoTrip, página inicial" width="108" height="40">
    </a>
    <nav aria-label="Menu principal">
      <ul class="pilulas">
        <li><a href="index.html">Início</a></li>
        <li><a href="destinos.html" aria-current="page">Destinos</a></li>
        <li><a href="mapa.html">Mapa</a></li>
        <li><a href="agenda.html">Agenda</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="sobre_a_equipe.html">Sobre</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section aria-labelledby="titulo-destinos">
      <a class="voltar" href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar para o início</a>
      <h1 id="titulo-destinos">Destinos</h1>
      <form id="form-busca" action="destinos.html" method="get" role="search">
        <label for="busca">Buscar destino</label>
        <div class="campo-busca">
          <input type="search" id="busca" name="busca" placeholder="Cidade, país ou atração" autocomplete="off">
          <button type="submit"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Buscar</button>
        </div>
      </form>
      <p id="resultado-cidades" role="status" aria-live="polite"></p>
      <!-- Os cartões das cidades são criados pelo destinos.js a partir do pontos.js -->
      <div id="lista-cidades" class="lista-cartoes"></div>
    </section>

    <section aria-labelledby="titulo-pontos">
      <h2 id="titulo-pontos">Pontos turísticos</h2>
      <div class="campo campo-filtro">
        <label for="filtro-cidade">Cidade</label>
        <select id="filtro-cidade"><option value="">Todas as cidades</option></select>
      </div>
      <p id="resultado-busca" role="status" aria-live="polite"></p>
      <!-- Os cartões das atrações são criados pelo script.js a partir do pontos.js -->
      <div id="lista-pontos" class="lista-cartoes"></div>
    </section>
  </main>

  <footer>
    <nav aria-label="Menu do rodapé">
      <ul class="pilulas">
        <li><a href="comofunciona.html">Como funciona</a></li>
        <li><a href="ajuda.html">Ajuda</a></li>
        <li><a href="sobre_a_equipe.html">Sobre</a></li>
      </ul>
    </nav>
    <address>
      <a class="chip" href="mailto:contato@gotrip.com"><i class="fa-regular fa-envelope" aria-hidden="true"></i> contato@gotrip.com</a>
    </address>
    <p>© 2026 GoTrip. Todos os direitos reservados.</p>
  </footer>

  <script src="pontos.js"></script>
  <script src="base-atracoes.js"></script>
  <script src="destinos.js"></script>
  <script src="script.js"></script>
</body>
</html>
