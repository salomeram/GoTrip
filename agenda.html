      <h1 id="titulo-agenda">Agenda</h1>
      <p>Toque em um dia do calendário para ver ou anotar uma atividade.</p>

      <div class="calendario-caixa">
        <div class="calendario-topo">
          <button type="button" id="cal-antes" class="botao-cal" aria-label="Mês anterior">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
          </button>
          <h2 id="cal-mes">Carregando…</h2>
          <button type="button" id="cal-depois" class="botao-cal" aria-label="Mês seguinte">

          </button>
          <button type="button" id="cal-hoje" class="botao-cal botao-hoje">Hoje</button>
        </div>

        <div class="calendario" id="calendario" role="grid" aria-label="Calendário da viagem"></div>
      </div>

      <p id="agenda-aviso" class="aviso" role="alert" hidden></p>

      <section class="dia-selecionado" id="dia-selecionado" aria-live="polite"></section>
    </section>
